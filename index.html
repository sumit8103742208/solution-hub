<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solution Hub</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body { background: #0d0d0d; color: white; font-family: sans-serif; padding: 20px; }
.container { max-width: 500px; margin: auto; text-align: center; }
.input-box { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
input, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #444; color: white; border-radius: 5px; }
button { width: 100%; padding: 12px; background: #deff9a; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: black; }
.card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: left; border-left: 4px solid #deff9a; }
.post-img { width: 100%; border-radius: 8px; margin-top: 10px; }
.delete-btn { color: #ff4d4d; background: none; border: none; cursor: pointer; margin-top: 10px; }
</style>
</head>

<body>

<div class="container">
    <h1>💡 Solution Hub</h1>

    <div class="input-box">
        <input type="text" id="name" placeholder="Aapka Naam">
        <textarea id="msg" placeholder="Aapka Sawal"></textarea>
        <input type="text" id="img" placeholder="Photo Link (Optional)">
        <button onclick="sendPost()">Post to Public Board</button>
    </div>

    <div id="feed"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// 🔴 IMPORTANT: Apna REAL config yaha paste karo
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  databaseURL: "https://solution-hub-2e11d-default-rtdb.firebaseio.com",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ✅ POST FUNCTION
function sendPost() {
    const uName = document.getElementById('name').value.trim();
    const uMsg = document.getElementById('msg').value.trim();
    const uImg = document.getElementById('img').value.trim();

    if(!uName || !uMsg) {
        alert("Naam aur sawal likho!");
        return;
    }

    db.ref('posts').push({
        name: uName,
        msg: uMsg,
        img: uImg || ""
    })
    .then(() => {
        alert("Post ho gaya!");
        document.getElementById('name').value = "";
        document.getElementById('msg').value = "";
        document.getElementById('img').value = "";
    })
    .catch((err) => {
        console.error(err);
        alert("Error: " + err.message);
    });
}

// ✅ REALTIME DATA SHOW
db.ref('posts').on('value', (snap) => {
    const feed = document.getElementById('feed');
    let html = "";

    snap.forEach((child) => {
        const data = child.val();
        const id = child.key;

        html = `
            <div class="card">
                <strong style="color:#deff9a;">${data.name}</strong>
                <p>${data.msg}</p>
                ${data.img ? `<img src="${data.img}" class="post-img">` : ""}
                <button class="delete-btn" onclick="delPost('${id}')">
                    <i class="fas fa-trash"></i> Delete
                </button>
            </div>
        ` + html;
    });

    feed.innerHTML = html;
});

// ✅ DELETE FUNCTION
function delPost(id) {
    if(confirm("Delete karein?")) {
        db.ref('posts/' + id).remove()
        .catch(err => alert(err.message));
    }
}

</script>

</body>
</html>
