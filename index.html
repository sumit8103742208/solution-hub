<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solution Hub</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
    background:#0f2027;
    color:#fff;
    font-family:Poppins;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

input, textarea{
    width:100%;
    margin:8px 0;
    padding:10px;
}

button{
    padding:10px;
    width:100%;
    cursor:pointer;
}

.card{
    background:#222;
    padding:15px;
    margin:10px 0;
}
</style>
</head>

<body>

<div class="container">
    <h1>Solution Hub</h1>

    <input type="text" id="name" placeholder="Enter your name">
    <textarea id="msg" placeholder="Ask question"></textarea>
    <input type="text" id="img" placeholder="Image link">

    <!-- 🔥 FIX -->
    <button onclick="sendPost()">Post</button>

    <div id="feed"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// 🔥 Firebase Config (अपना डाल)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://solution-hub-2e11d-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();


// ✅ POST
function sendPost(){
    const name = document.getElementById("name").value.trim();
    const msg = document.getElementById("msg").value.trim();
    const img = document.getElementById("img").value.trim();

    if(!name || !msg){
        alert("Naam aur question likho!");
        return;
    }

    db.ref("posts").push({
        name, msg, img
    });

    document.getElementById("name").value="";
    document.getElementById("msg").value="";
    document.getElementById("img").value="";
}


// ✅ REALTIME LOAD
db.ref("posts").on("value", snapshot=>{
    const feed = document.getElementById("feed");
    let html="";

    snapshot.forEach(child=>{
        const data = child.val();
        const id = child.key;

        html = `
        <div class="card">
            <strong>${data.name}</strong>
            <p>${data.msg}</p>
            ${data.img ? `<img src="${data.img}" width="100%">` : ""}

            <button onclick="deletePost('${id}')">Delete</button>
        </div>
        ` + html;
    });

    feed.innerHTML = html;
});


// ✅ DELETE
function deletePost(id){
    db.ref("posts/"+id).remove();
}

</script>

</body>
</html>
