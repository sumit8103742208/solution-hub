<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution Hub - Public Board</title>
    <style>
        :root { --neon: #deff9a; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        header { text-align: center; border-bottom: 2px solid var(--neon); padding-bottom: 20px; }
        .post-box { background: #111; padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #333; }
        input, textarea { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 10px; margin-bottom: 10px; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--neon); color: black; border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
        .feed { margin-top: 40px; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 20px; border-left: 5px solid var(--neon); }
        .card h3 { margin: 0; color: var(--neon); font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .card p { color: #ccc; line-height: 1.6; }
        .card img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #333; }
        .post-actions { margin-top: 15px; display: flex; gap: 15px; border-top: 1px solid #333; padding-top: 10px; }
        .action-btn { background: none; border: none; color: var(--neon); cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .delete-btn { color: #ff4d4d !important; }
        .reply-section { margin-top: 10px; padding: 10px; background: #222; border-radius: 8px; display: none; }
    </style>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container">
    <header>
        <h1>💡 Solution Hub Board</h1>
        <p>Bina login ke apna sawal post karein aur community se jawab payein.</p>
    </header>

    <div class="post-box">
        <!-- Input IDs Fixed Here -->
        <input type="text" id="nameInput" placeholder="Aapka Naam...">
        <textarea id="messageInput" rows="4" placeholder="Apna Sawal/Problem likhein..."></textarea>
        <input type="text" id="imgUrlInput" placeholder="Photo link (URL) paste karein...">
        <button id="postButton">Post to Public Board</button>
    </div>

    <div class="feed" id="postFeed">
        <!-- Data will appear here -->
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyA8QyetPW2sVH3CVENKQIhajmQq-N1N4dE",
        authDomain: "solution-hub-2e11d.firebaseapp.com",
        projectId: "solution-hub-2e11d",
        databaseURL: "https://solution-hub-2e11d-default-rtdb.firebaseio.com",
        storageBucket: "solution-hub-2e11d.firebasestorage.app",
        messagingSenderId: "1055199293380",
        appId: "1:1055199293380:web:9b95ec33bc1609d184fe91"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. Function to Save Post
    document.getElementById('postButton').onclick = function() {
        const name = document.getElementById('nameInput').value;
        const msg = document.getElementById('messageInput').value;
        const img = document.getElementById('imgUrlInput').value;

        if (name.trim() === "" || msg.trim() === "") {
            alert("Naam aur Sawal likhna jaruri hai!");
            return;
        }

        const postRef = ref(db, 'posts');
        const newPostRef = push(postRef);

        set(newPostRef, {
            username: name,
            question: msg,
            image: img,
            timestamp: Date.now()
        }).then(() => {
            alert("Sawal Post ho gaya!");
            // Clearing Inputs
            document.getElementById('nameInput').value = "";
            document.getElementById('messageInput').value = "";
            document.getElementById('imgUrlInput').value = "";
        }).catch((error) => {
            alert("Error: " + error.message);
        });
    };

    // 2. Global Delete Function
    window.deletePost = function(postId) {
        if(confirm("Kya aap such me ye post delete karna chahte hain?")) {
            remove(ref(db, 'posts/' + postId))
            .then(() => alert("Post delete ho gayi!"))
            .catch((error) => alert("Error: " + error.message));
        }
    };

    // 3. Toggle Reply Section
    window.toggleReply = function(postId) {
        const replyDiv = document.getElementById('reply-' + postId);
        if (replyDiv.style.display === 'block') {
            replyDiv.style.display = 'none';
        } else {
            replyDiv.style.display = 'block';
        }
    };

    // 4. Load Posts in Real-time
    onValue(ref(db, 'posts'), (snapshot) => {
        const postFeed = document.getElementById('postFeed');
        postFeed.innerHTML = ""; 
        
        snapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val();
            const key = childSnapshot.key;
            
            const postHtml = `
                <div class="card">
                    <h3><i class="fas fa-user-circle"></i> \${data.username}</h3>
                    <p>\${data.question}</p>
                    \${data.image ? `<img src="\${data.image}" alt="Post Image">` : ""}
                    
                    <div class="post-actions">
                        <button class="action-btn" onclick="toggleReply('\${key}')">
                            <i class="fas fa-reply"></i> Reply
                        </button>
                        <button class="action-btn delete-btn" onclick="deletePost('\${key}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>

                    <div id="reply-\${key}" class="reply-section">
                        <input type="text" placeholder="Apna jawab likhein...">
                        <button class="action-btn" style="width: auto; padding: 5px 15px;">Send</button>
                    </div>
                </div>
            `;
            // Newest posts on top
            postFeed.innerHTML = postHtml + postFeed.innerHTML;
        });
    });
</script>

</body>
</html>
