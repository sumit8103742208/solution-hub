<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution Hub | Live Board</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #deff9a; --bg: #0d0d0d; --glass: rgba(255, 255, 255, 0.05); }
        body { background: var(--bg); color: #efefef; font-family: 'Outfit', sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--neon); text-shadow: 0 0 15px rgba(222, 255, 154, 0.3); }

        .input-group { background: var(--glass); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; box-sizing: border-box; }
        
        button#mainBtn { width: 100%; padding: 15px; background: var(--neon); border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button#mainBtn:hover { transform: scale(1.02); background: #c4e67a; }

        .card { background: var(--glass); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .post-img { width: 100%; border-radius: 10px; margin-top: 10px; }
        .post-actions { display: flex; gap: 20px; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; }
        .action-btn { background: none; border: none; color: var(--neon); cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .delete-btn { color: #ff4d4d; }
        .reply-box { margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>💡 Solution Hub</h1>
        <p style="color: #888;">Post your query and get help from the community.</p>
    </div>

    <div class="input-group">
        <input type="text" id="userName" placeholder="Your Name...">
        <textarea id="userMsg" rows="3" placeholder="Describe your problem here..."></textarea>
        <input type="text" id="imgUrl" placeholder="Image Link (Optional)...">
        <button id="mainBtn" onclick="addPost()">Post to Public Board</button>
    </div>

    <div id="postFeed"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    // 100% Correct Database Link
    const firebaseConfig = {
        databaseURL: "https://solution-hub-2e11d-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // POST KARNE KA FUNCTION
    window.addPost = function() {
        const name = document.getElementById('userName').value;
        const msg = document.getElementById('userMsg').value;
        const img = document.getElementById('imgUrl').value;

        if (!name || !msg) {
            alert("Bhai, Naam aur Sawal likhna zaroori hai!");
            return;
        }

        const postRef = ref(db, 'posts');
        const newPostRef = push(postRef);

        set(newPostRef, {
            username: name,
            question: msg,
            image: img || null,
            time: Date.now()
        }).then(() => {
            alert("Post Successful!"); // Yeh ab dikhega!
            document.getElementById('userName').value = "";
            document.getElementById('userMsg').value = "";
            document.getElementById('imgUrl').value = "";
        }).catch((e) => alert("Error: " + e.message));
    };

    // DATA DIKHANE KA FUNCTION
    onValue(ref(db, 'posts'), (snapshot) => {
        const feed = document.getElementById('postFeed');
        feed.innerHTML = "";
        
        if (snapshot.exists()) {
            let data = [];
            snapshot.forEach((child) => { data.push({ id: child.key, ...child.val() }); });
            data.reverse().forEach((post) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <i class="fas fa-user-circle" style="color:var(--neon)"></i>
                        <strong style="color:var(--neon)">\${post.username}</strong>
                    </div>
                    <p style="margin:12px 0;">\${post.question}</p>
                    \${post.image ? `<img src="\${post.image}" class="post-img">` : ""}
                    
                    <div class="post-actions">
                        <button class="action-btn" onclick="toggleReply('\${post.id}')"><i class="fas fa-comment"></i> Reply</button>
                        <button class="action-btn delete-btn" onclick="deletePost('\${post.id}')"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                    <div id="reply-\${post.id}" class="reply-box">
                        <input type="text" placeholder="Write a reply...">
                    </div>
                `;
                feed.appendChild(div);
            });
        }
    });

    window.deletePost = function(id) { if(confirm("Delete karein?")) remove(ref(db, 'posts/' + id)); };
    window.toggleReply = function(id) {
        const r = document.getElementById('reply-' + id);
        r.style.display = r.style.display === 'block' ? 'none' : 'block';
    };
</script>

</body>
</html>
