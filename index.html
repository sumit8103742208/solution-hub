<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution Hub | Community</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #deff9a; --bg: #0d0d0d; --glass: rgba(255, 255, 255, 0.05); }
        body { background: var(--bg); color: #efefef; font-family: 'Outfit', sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 550px; margin: auto; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--neon); text-shadow: 0 0 15px rgba(222, 255, 154, 0.3); }

        .input-group { background: var(--glass); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; box-sizing: border-box; outline: none; }
        
        button#mainBtn { width: 100%; padding: 15px; background: var(--neon); border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; color: #000; transition: 0.3s; }
        button#mainBtn:hover { background: #c4e67a; box-shadow: 0 0 20px rgba(222,255,154,0.4); }

        .card { background: var(--glass); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .post-img { width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #333; }
        .post-actions { display: flex; gap: 20px; margin-top: 15px; border-top: 1px solid #444; padding-top: 10px; }
        .action-btn { background: none; border: none; color: var(--neon); cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 14px; }
        .delete-btn { color: #ff4d4d; }
        .reply-box { margin-top: 10px; display: none; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>💡 Solution Hub</h1>
        <p style="color: #888;">Expertise sharing made simple.</p>
    </div>

    <div class="input-group">
        <input type="text" id="userName" placeholder="Your Name...">
        <textarea id="userMsg" rows="3" placeholder="Write your question here..."></textarea>
        <input type="text" id="imgUrl" placeholder="Image URL (Optional)...">
        <button id="mainBtn" onclick="addPost()">Publish to Board</button>
    </div>

    <div id="postFeed"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // 1. Firebase Configuration
    const firebaseConfig = {
        databaseURL: "https://solution-hub-2e11d-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 2. Add Post Function
    function addPost() {
        const name = document.getElementById('userName').value.trim();
        const msg = document.getElementById('userMsg').value.trim();
        const img = document.getElementById('imgUrl').value.trim();

        if (name === "" || msg === "") {
            alert("Bhai, Name aur Message dono fill karo!");
            return;
        }

        const btn = document.getElementById('mainBtn');
        btn.innerText = "Posting...";
        btn.disabled = true;

        database.ref('posts').push({
            username: name,
            question: msg,
            image: img || null,
            timestamp: Date.now()
        }).then(() => {
            alert("Post ho gaya! ✅");
            document.getElementById('userName').value = "";
            document.getElementById('userMsg').value = "";
            document.getElementById('imgUrl').value = "";
        }).catch((err) => {
            alert("Galti: " + err.message);
        }).finally(() => {
            btn.innerText = "Publish to Board";
            btn.disabled = false;
        });
    }

    // 3. Display Data
    database.ref('posts').on('value', (snapshot) => {
        const feed = document.getElementById('postFeed');
        feed.innerHTML = "";
        
        if (snapshot.exists()) {
            let posts = [];
            snapshot.forEach((child) => {
                posts.push({ id: child.key, ...child.val() });
            });

            posts.reverse().forEach((post) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <i class="fas fa-user-circle" style="color:var(--neon); font-size:20px;"></i>
                        <strong style="color:var(--neon)">\${post.username}</strong>
                    </div>
                    <p style="margin:12px 0; line-height:1.6;">\${post.question}</p>
                    \${post.image ? `<img src="\${post.image}" class="post-img" onerror="this.style.display='none'">` : ""}
                    
                    <div class="post-actions">
                        <button class="action-btn" onclick="toggleReply('\${post.id}')"><i class="fas fa-comment-dots"></i> Discuss</button>
                        <button class="action-btn delete-btn" onclick="deletePost('\${post.id}')"><i class="fas fa-trash-can"></i> Remove</button>
                    </div>
                    <div id="reply-\${post.id}" class="reply-box">
                        <input type="text" placeholder="Write a reply..." style="margin:0; font-size:13px;">
                    </div>
                `;
                feed.appendChild(card);
            });
        } else {
            feed.innerHTML = "<p style='text-align:center; color:#555;'>No posts yet. Start the discussion!</p>";
        }
    });

    // 4. Delete & Reply Functions
    function deletePost(id) {
        if(confirm("Bhai, pakka delete karu?")) {
            database.ref('posts/' + id).remove();
        }
    }

    function toggleReply(id) {
        const box = document.getElementById('reply-' + id);
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }
</script>

</body>
</html>
