<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution Hub - Public Board</title>
    <style>
        :root { --neon: #deff9a; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        header { text-align: center; border-bottom: 2px solid var(--neon); padding-bottom: 20px; }
        .post-box { background: #111; padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #333; }
        input, textarea { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 10px; margin-bottom: 10px; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--neon); color: black; border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
        .feed { margin-top: 40px; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 20px; border-left: 5px solid var(--neon); }
        .card h3 { margin: 0; color: var(--neon); font-size: 18px; }
        .card p { color: #ccc; line-height: 1.6; }
        .card img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #333; }
        .reply-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #444; font-size: 14px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💡 Solution Hub Board</h1>
        <p>Bina login ke apna sawal post karein aur community se jawab payein.</p>
    </header>

    <div class="post-box">
        <!-- IDs yahan fix kar di hain taaki JS se match karein -->
        <input type="text" id="nameInput" placeholder="Aapka Naam...">
        <textarea id="messageInput" rows="4" placeholder="Apna Sawal/Problem likhein..."></textarea>
        <input type="text" id="imgUrlInput" placeholder="Image URL (Optionally paste image link here)">
        <button id="postButton">Post to Public Board</button>
    </div>

    <div class="feed" id="postFeed">
        <!-- Data yahan dikhega -->
    </div>
</div>

<!-- Firebase Script -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA8QyetPW2sVH3CVENKQIhajmQq-N1N4dE",
    authDomain: "solution-hub-2e11d.firebaseapp.com",
    projectId: "solution-hub-2e11d",
    databaseURL: "https://solution-hub-2e11d-default-rtdb.firebaseio.com",
    storageBucket: "solution-hub-2e11d.firebasestorage.app",
    messagingSenderId: "1055199293380",
    appId: "1:1055199293380:web:9b95ec33bc1609d184fe91"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  // POST BHEJNE KE LIYE
  document.getElementById('postButton').onclick = function(e) {
      e.preventDefault();

      const u_name = document.getElementById('nameInput').value;
      const u_message = document.getElementById('messageInput').value;
      const u_img = document.getElementById('imgUrlInput').value;

      if (u_name == "" || u_message == "") {
          alert("Naam aur Sawal zaruri hai!");
          return;
      }

      const postListRef = ref(database, 'posts');
      const newPostRef = push(postListRef);

      set(newPostRef, {
          username: u_name,
          question: u_message,
          image: u_img,
          time: Date.now()
      }).then(() => {
          alert("Success! Board par check karein.");
          document.getElementById('nameInput').value = "";
          document.getElementById('messageInput').value = "";
          document.getElementById('imgUrlInput').value = "";
      });
  };

  // DATA DIKHANE KE LIYE (REALTIME FEED)
  const postFeed = document.getElementById('postFeed');
  onValue(ref(database, 'posts'), (snapshot) => {
      postFeed.innerHTML = ""; // Purana clear karo
      snapshot.forEach((childSnapshot) => {
          const data = childSnapshot.val();
          const card = document.createElement('div');
          card.className = 'card';
          
          let imgTag = data.image ? `<img src="${data.image}">` : '';
          
          card.innerHTML = `
              <h3>${data.username}</h3>
              <p>${data.question}</p>
              ${imgTag}
              <div class="reply-box">🗨️ Community Discussion On...</div>
          `;
          postFeed.prepend(card); // Naya upar dikhao
      });
  });
</script>

</body>
</html>
