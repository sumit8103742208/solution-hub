<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution Hub - Public Board</title>
    <style>
        :root { --neon: #deff9a; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        header { text-align: center; border-bottom: 2px solid var(--neon); padding-bottom: 20px; }
        .post-box { background: #111; padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #333; }
        input, textarea { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 10px; margin-bottom: 10px; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--neon); color: black; border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
        .feed { margin-top: 40px; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 20px; border-left: 5px solid var(--neon); }
        .card h3 { margin: 0; color: var(--neon); font-size: 18px; }
        .card p { color: #ccc; line-height: 1.6; }
        .card img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #333; }
        .reply-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #444; font-size: 14px; color: #888; }
        .post-actions { margin-top: 10px; display: flex; gap: 15px; border-top: 1px solid #333; padding-top: 10px; }
.action-btn { background: none; border: none; color: var(--neon); cursor: pointer; font-size: 14px; }
.delete-btn { color: #ff4d4d; }
.reply-section { margin-top: 10px; padding-left: 20px; border-left: 2px solid var(--neon); display: none; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
<body>

<div class="container">
    <header>
        <h1>💡 Solution Hub Board</h1>
        <p>Bina login ke apna sawal post karein aur community se jawab payein.</p>
    </header>

    <div class="post-box">
        <!-- IDs yahan fix kar di hain taaki JS se match karein -->
        <input type="text" id="nameInput" placeholder="Aapka Naam...">
        <textarea id="messageInput" rows="4" placeholder="Apna Sawal/Problem likhein..."></textarea>
        <input type="text" id="imgUrlInput" placeholder="Image URL (Optionally paste image link here)">
        <button id="postButton">Post to Public Board</button>
    </div>

    <div class="feed" id="postFeed">
        <!-- Data yahan dikhega -->
    </div>
</div>

<!-- Firebase Script -->
<script type="module">
  // ... (Firebase setup wahi rahega jo pehle tha)

// 1. Post bhejne ka function (Image URL ke saath)
window.addPost = function() {
    const name = document.getElementById('userName').value;
    const msg = document.getElementById('userMsg').value;
    const img = document.getElementById('imgUrl').value;

    if (name === "" || msg === "") {
        alert("Naam aur Sawal jaruri hai!");
        return;
    }

    const postRef = ref(db, 'posts');
    const newPostRef = push(postRef);

    set(newPostRef, {
        username: name,
        question: msg,
        image: img,
        timestamp: Date.now()
    }).then(() => {
        alert("Post successful!");
        // Input saaf karna
        document.getElementById('userName').value = "";
        document.getElementById('userMsg').value = "";
        document.getElementById('imgUrl').value = "";
    });
};

// 2. Delete karne ka function
window.deletePost = function(postId) {
    if(confirm("Kya aap ye post delete karna chahte hain?")) {
        set(ref(db, 'posts/' + postId), null)
        .then(() => alert("Post Deleted!"))
        .catch((err) => alert("Error: " + err.message));
    }
};

// 3. Reply box dikhane ka function
window.toggleReply = function(postId) {
    const replyDiv = document.getElementById('reply-' + postId);
    replyDiv.style.display = replyDiv.style.display === 'block' ? 'none' : 'block';
};

// 4. Data dikhane wala logic (Icons ke saath)
onValue(ref(db, 'posts'), (snapshot) => {
    const postFeed = document.getElementById('postFeed');
    postFeed.innerHTML = ""; 
    
    snapshot.forEach((childSnapshot) => {
        const data = childSnapshot.val();
        const key = childSnapshot.key;
        
        const postHtml = `
            <div class="card">
                <h3><i class="fas fa-user-circle"></i> \${data.username}</h3>
                <p>\${data.question}</p>
                \${data.image ? `<img src="\${data.image}" style="width:100%; border-radius:10px; margin:10px 0;">` : ""}
                
                <div class="post-actions">
                    <button class="action-btn" onclick="toggleReply('\${key}')">
                        <i class="fas fa-reply"></i> Reply
                    </button>
                    <button class="action-btn delete-btn" onclick="deletePost('\${key}')">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>

                <div id="reply-\${key}" class="reply-section">
                    <input type="text" placeholder="Apna jawab likhein..." style="width:80%;">
                    <button class="action-btn">Send</button>
                </div>
            </div>
        `;
        postFeed.innerHTML = postHtml + postFeed.innerHTML;
    });
});
</script>

</body>
</html>
